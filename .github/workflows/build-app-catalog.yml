name: Build Arnux App Catalog

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'scripts/build-app-catalog.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-app-catalog.js
      - name: Commit generated catalog
        run: |
          git config user.name "arnux-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/catalog.js
          git diff --cached --quiet || git commit -m "chore: rebuild Arnux app catalog"
          git push
