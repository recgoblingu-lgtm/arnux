<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Arnux — a full browser operating system."><title>Arnux OS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body>
<div id="os" class="os-shell">
  <header class="topbar"><div class="os-logo"><span>A</span> arnux <small>OS 1.0</small></div><div class="top-center" id="topTime"></div><div class="top-right"><span class="wifi">◉</span><span id="battery">100%</span><button id="powerButton" title="Power menu">⏻</button></div></header>
  <main class="workspace" id="workspace"><div class="desktop-welcome"><div class="welcome-badge">ARN</div><h1>Welcome to Arnux</h1><p>A friendly operating system for the open web.</p><div class="desktop-shortcuts"><button data-open="browser"><b>◎</b><span>Browser</span></button><button data-open="files"><b>▧</b><span>Files</span></button><button data-open="terminal"><b>›_</b><span>Terminal</span></button><button data-open="store"><b>▦</b><span>ArnuxStore</span></button></div></div></main>
  <footer class="dock"><button class="launcher" id="launcherButton">A</button><div class="dock-apps"><button data-open="browser" title="Browser">◎</button><button data-open="files" title="Files">▧</button><button data-open="terminal" title="Terminal">›_</button><button data-open="notes" title="Notes">✎</button><button data-open="store" title="ArnuxStore">▦</button></div><div class="dock-date" id="dockDate"></div></footer>
</div>
<div id="launcherMenu" class="launcher-menu"><div class="launcher-title">Arnux applications</div><div id="launcherApps" class="launcher-grid"></div></div>
<div id="nanoModal" class="nano-modal"><div class="nano-window"><div class="nano-header"><span id="nanoTitle">GNU nano</span><span>local file editor</span></div><textarea id="nanoEditor" spellcheck="false"></textarea><div class="nano-footer"><span>^O Write Out</span><span>^X Exit</span><div><button id="nanoCancel">Cancel</button><button id="nanoSave">Save file</button></div></div></div></div>
<script src="app.js"></script>
</body></html>
